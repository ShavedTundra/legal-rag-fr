[project]
name = "legal-rag-fr"
version = "0.1.0"
description = "Moteur de recherche hybride (BM25 + dense + RRF) sur le droit français"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
dense = ["sentence-transformers>=6.1.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "rank-bm25==0.2.2",
    "numpy>=2.5",
]
